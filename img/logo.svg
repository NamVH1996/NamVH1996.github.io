<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0084d1" rx="16"/>

  <!-- Dashboard Grid -->
  <g fill="#ffffff" opacity="0.9">
    <!-- Top left cell -->
    <rect x="12" y="16" width="40" height="40" rx="3"/>
    <!-- Top right cell -->
    <rect x="76" y="16" width="40" height="40" rx="3"/>
    <!-- Bottom left cell -->
    <rect x="12" y="72" width="40" height="40" rx="3"/>
    <!-- Bottom right cell -->
    <rect x="76" y="72" width="40" height="40" rx="3"/>
  </g>

  <!-- Monitoring elements (inner details) -->
  <g stroke="#0084d1" stroke-width="2" fill="none">
    <!-- Metrics chart -->
    <polyline points="20,40 28,32 36,36 44,24" stroke="#666" stroke-width="1.5"/>
    <circle cx="20" cy="40" r="1.5" fill="#666"/>
    <circle cx="28" cy="32" r="1.5" fill="#666"/>
    <circle cx="36" cy="36" r="1.5" fill="#666"/>
    <circle cx="44" cy="24" r="1.5" fill="#666"/>

    <!-- Health indicator -->
    <circle cx="96" cy="36" r="8" fill="none" stroke="#4caf50" stroke-width="1.5"/>
    <circle cx="96" cy="36" r="4" fill="#4caf50"/>

    <!-- Alert indicator -->
    <path d="M 28 92 L 32 80 L 36 92 Z" fill="#ff9800" stroke="#ff9800" stroke-width="1"/>

    <!-- Status bars -->
    <rect x="84" y="90" width="2" height="16" fill="#4caf50"/>
    <rect x="89" y="85" width="2" height="21" fill="#4caf50"/>
    <rect x="94" y="88" width="2" height="18" fill="#4caf50"/>
  </g>
</svg>
