global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

receivers:
  - name: 'default'
    # Add your notification integrations here
    # Examples:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'

  - name: 'critical'
    # Critical alert handlers
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/CRITICAL/WEBHOOK'

  - name: 'warning'
    # Warning alert handlers
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WARNING/WEBHOOK'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
