global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'production'
    environment: 'prod'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Example job for monitoring other services
  # - job_name: 'my-app'
  #   static_configs:
  #     - targets: ['localhost:8000']
  #   metrics_path: '/metrics'
  #   scrape_interval: 10s
