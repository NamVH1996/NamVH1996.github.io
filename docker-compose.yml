version: '3.8'

services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_ALLOW_UI_UPDATES=true
      - GF_PLUGINS_ALLOW_UNSIGNED_PLUGINS=all-in-one-app
      - GF_INSTALL_PLUGINS=
      - GF_LOG_LEVEL=debug
    volumes:
      - grafana-storage:/var/lib/grafana
      # Plugin bundle (frontend + backend binary) mounted directly
      - ./dist:/var/lib/grafana/plugins/all-in-one-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  grafana-storage:

# Note: Backend is now part of the plugin bundle
# Grafana automatically runs the binary: dist/grafana-all-in-one-plugin-app
# For local development with separate backend service, see QUICK_START.md
