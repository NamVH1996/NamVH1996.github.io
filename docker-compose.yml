version: '3.8'

services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_ALLOW_UI_UPDATES=true
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./dist:/var/lib/grafana/plugins/all-in-one-app
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - plugin-backend

  # Backend plugin runs as separate service that Grafana calls via API
  plugin-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plugin-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    networks:
      - app-network
    restart: unless-stopped

volumes:
  grafana-storage:

networks:
  app-network:
    driver: bridge
